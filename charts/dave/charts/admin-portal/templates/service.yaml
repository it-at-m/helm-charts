apiVersion: v1
kind: Service
metadata:
  name: {{ include "daveAdminPortal.fullname" . }}
  labels:
    {{- include "daveAdminPortal.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  {{- if .Values.service.port }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  {{- else if .Values.service.ports }}
  ports:
    {{- range .Values.service.ports }}
    - port: {{ .port }}
      targetPort: {{ .targetPort }}
      protocol: {{ .protocol }}
      name: {{ .name }}
    {{- end }}
  {{- else }}
    {{- fail "service.ports oder service.port muss gesetzt sein" }}
  {{- end }}

  selector:
    {{- include "daveAdminPortal.selectorLabels" . | nindent 4 }}
