# Dave Document Storage
document-storage:
  # Environment variables
  extraEnvVars:
    JAVA_OPTS_APPEND: -Djavax.net.ssl.trustStore=/mnt/cacerts -Djavax.net.ssl.trustStorePassword=changeit -Xmx512m
    SPRING_PROFILES_ACTIVE: dev,no-security
    SPRING_SECURITY_LOGGING_REQUESTS: all
    DE_MUENCHEN_REFARCH_INTEGRATION_S3_ENABLED: "false"
    REFARCH_S3_URL: s3.example.com
    REFARCH_S3_BUCKETNAME: dave-bucket
    REFARCH_S3_ACCESSKEY: EXAMPLE
    REFARCH_S3_SECRETKEY: dummysecret

# Geodata EAI
geodata-eai:
  # Environment variables
  extraEnvVars:
    MOBIDAM_MESSWERTE_EAI_URL: http://mobidam.example.com
    FEATURE_SERVER_URL_MESSSTELLE: https://mobidam.example.com/Verkehrsdetektoren_VIEW/FeatureServer/1000/query
    FEATURE_SERVER_URL_MESSQUERSCHNITT: https://mobidam.example.com/Verkehrsdetektoren_VIEW/FeatureServer/2000/query
    FEATURE_SERVER_URL_MESSFAEHIGKEIT: https://mobidam.example.com/Verkehrsdetektoren_VIEW/FeatureServer/3000/query
    FEATURE_SERVER_URL_MESSWERTETAGESAGGREGAT: https://mobidam.example.com/Verkehrsdetektoren_VIEW/FeatureServer/4000/query

elasticsearch:
  fullnameOverride: "dave-elasticsearch"
  # keine persistent volumes im CI (kind)
  persistence:
    enabled: false
  esConfig:
    elasticsearch.yml: |
      xpack.security.enabled: false
      xpack.security.http.ssl.enabled: false
      xpack.security.transport.ssl.enabled: false
      discovery.type: single-node
  # geringe Ressourcen für CI/kind
  master:
    heapSize: 512m
    resources:
      limits:
        memory: 1Gi
      requests:
        memory: 512Mi

postgresql:
  fullnameOverride: dave-postgresql
  primary:
    persistence:
      enabled: false
  auth:
    postgresPassword: postgrespw            # Superuser-Passwort (optional)
    username: dave                          # erzeugter DB-User
    password: dave_pwd                      # Passwort für erzeugten User
    database: dave_db                       # erzeugte DB
