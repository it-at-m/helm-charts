suite: Autoscaling (HPA) tests
templates:
  - templates/hpa.yaml

tests:
  - it: does not render an HPA when autoscaling is disabled
    set:
      __unittest:
        enabled: true
        config:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders an HPA with default minReplicas and a CPU utilization target
    set:
      __unittest:
        enabled: true
        config:
          enabled: true
          maxReplicas: 5
          targetCPUUtilizationPercentage: 70
    asserts:
      - hasDocuments:
          count: 1
      - isAPIVersion:
          of: autoscaling/v2
      - isKind:
          of: HorizontalPodAutoscaler
      - equal:
          path: spec.scaleTargetRef.apiVersion
          value: apps/v1
      - equal:
          path: spec.scaleTargetRef.kind
          value: Deployment
      - equal:
          path: spec.minReplicas
          value: 1
      - equal:
          path: spec.maxReplicas
          value: 5
      - equal:
          path: spec.metrics
          value:
            - type: Resource
              resource:
                name: cpu
                target:
                  type: Utilization
                  averageUtilization: 70

  - it: renders a CPU AverageValue target
    set:
      __unittest:
        enabled: true
        config:
          enabled: true
          minReplicas: 2
          maxReplicas: 10
          targetCPUAverageValue: 500m
    asserts:
      - equal:
          path: spec.minReplicas
          value: 2
      - equal:
          path: spec.maxReplicas
          value: 10
      - equal:
          path: spec.metrics[0].type
          value: Resource
      - equal:
          path: spec.metrics[0].resource.name
          value: cpu
      - equal:
          path: spec.metrics[0].resource.target.type
          value: AverageValue
      - equal:
          path: spec.metrics[0].resource.target.averageValue
          value: 500m

  - it: renders a memory utilization target
    set:
      __unittest:
        enabled: true
        config:
          enabled: true
          maxReplicas: 4
          targetMemoryUtilizationPercentage: 80
    asserts:
      - equal:
          path: spec.metrics
          value:
            - type: Resource
              resource:
                name: memory
                target:
                  type: Utilization
                  averageUtilization: 80

  - it: renders CPU and memory metrics together
    set:
      __unittest:
        enabled: true
        config:
          enabled: true
          minReplicas: 2
          maxReplicas: 8
          targetCPUUtilizationPercentage: 65
          targetMemoryAverageValue: 768Mi
    asserts:
      - lengthEqual:
          path: spec.metrics
          count: 2
      - equal:
          path: spec.metrics[0].resource.name
          value: cpu
      - equal:
          path: spec.metrics[0].resource.target.type
          value: Utilization
      - equal:
          path: spec.metrics[0].resource.target.averageUtilization
          value: 65
      - equal:
          path: spec.metrics[1].resource.name
          value: memory
      - equal:
          path: spec.metrics[1].resource.target.type
          value: AverageValue
      - equal:
          path: spec.metrics[1].resource.target.averageValue
          value: 768Mi

  - it: renders the configured HPA behavior
    set:
      __unittest:
        enabled: true
        config:
          enabled: true
          maxReplicas: 6
          targetCPUUtilizationPercentage: 75
          behavior:
            scaleDown:
              stabilizationWindowSeconds: 300
              policies:
                - type: Percent
                  value: 25
                  periodSeconds: 60
            scaleUp:
              stabilizationWindowSeconds: 0
              policies:
                - type: Pods
                  value: 2
                  periodSeconds: 60
    asserts:
      - equal:
          path: spec.behavior.scaleDown.stabilizationWindowSeconds
          value: 300
      - equal:
          path: spec.behavior.scaleDown.policies[0].type
          value: Percent
      - equal:
          path: spec.behavior.scaleDown.policies[0].value
          value: 25
      - equal:
          path: spec.behavior.scaleUp.policies[0].type
          value: Pods
      - equal:
          path: spec.behavior.scaleUp.policies[0].value
          value: 2

  - it: fails when maxReplicas is not configured
    set:
      __unittest:
        enabled: true
        config:
          enabled: true
          targetCPUUtilizationPercentage: 70
    asserts:
      - failedTemplate:
          errorMessage: "autoscaling: maxReplicas must be configured when autoscaling is enabled"

  - it: fails when maxReplicas is lower than minReplicas
    set:
      __unittest:
        enabled: true
        config:
          enabled: true
          minReplicas: 4
          maxReplicas: 3
          targetCPUUtilizationPercentage: 70
    asserts:
      - failedTemplate:
          errorMessage: "autoscaling: maxReplicas must be greater than or equal to minReplicas"

  - it: fails when both CPU target types are configured
    set:
      __unittest:
        enabled: true
        config:
          enabled: true
          maxReplicas: 5
          targetCPUUtilizationPercentage: 70
          targetCPUAverageValue: 500m
    asserts:
      - failedTemplate:
          errorMessage: "autoscaling: targetCPUUtilizationPercentage and targetCPUAverageValue are mutually exclusive"

  - it: fails when both memory target types are configured
    set:
      __unittest:
        enabled: true
        config:
          enabled: true
          maxReplicas: 5
          targetMemoryUtilizationPercentage: 80
          targetMemoryAverageValue: 512Mi
    asserts:
      - failedTemplate:
          errorMessage: "autoscaling: targetMemoryUtilizationPercentage and targetMemoryAverageValue are mutually exclusive"

  - it: fails when no CPU or memory target is configured
    set:
      __unittest:
        enabled: true
        config:
          enabled: true
          maxReplicas: 5
    asserts:
      - failedTemplate:
          errorMessage: "autoscaling: configure at least one CPU or memory target"
