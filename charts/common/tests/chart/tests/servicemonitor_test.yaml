
suite: ServiceMonitor tests
templates:
  - templates/servicemonitor.yaml

tests:
  - it: should not render ServiceMonitor when disabled
    set:
      serviceMonitor:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should render ServiceMonitor when enabled
    set:
      serviceMonitor:
        enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ServiceMonitor
      - isAPIVersion:
          of: monitoring.coreos.com/v1

  - it: should use default endpoint configuration
    set:
      serviceMonitor:
        enabled: true
    asserts:
      - equal:
          path: spec.endpoints[0].interval
          value: "15s"
      - equal:
          path: spec.endpoints[0].port
          value: "http"
      - equal:
          path: spec.endpoints[0].scheme
          value: "http"
      - equal:
          path: spec.endpoints[0].path
          value: "/actuator/prometheus"

  - it: should use custom endpoint configuration
    set:
      serviceMonitor:
        enabled: true
        interval: 30s
        port: metrics
        scheme: https
        path: /custom/metrics
    asserts:
      - equal:
          path: spec.endpoints[0].interval
          value: "30s"
      - equal:
          path: spec.endpoints[0].port
          value: "metrics"
      - equal:
          path: spec.endpoints[0].scheme
          value: "https"
      - equal:
          path: spec.endpoints[0].path
          value: "/custom/metrics"

  - it: should use defaults when optional values are empty
    set:
      serviceMonitor:
        enabled: true
        interval: ""
        port: ""
        scheme: ""
        path: ""
    asserts:
      - equal:
          path: spec.endpoints[0].interval
          value: "15s"
      - equal:
          path: spec.endpoints[0].port
          value: "http"
      - equal:
          path: spec.endpoints[0].scheme
          value: "http"
      - equal:
          path: spec.endpoints[0].path
          value: "/actuator/prometheus"

  - it: should use the common fullname for metadata name
    set:
      serviceMonitor:
        enabled: true
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-chart

  - it: should select services using common selector labels
    set:
      serviceMonitor:
        enabled: true
    asserts:
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: chart
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/instance"]
          value: RELEASE-NAME

  - it: should render exactly one endpoint
    set:
      serviceMonitor:
        enabled: true
    asserts:
      - lengthEqual:
          path: spec.endpoints
          count: 1
