apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "refarch-gateway.fullname" . }}
  labels:
    {{- include "refarch-gateway.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "refarch-gateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "refarch-gateway.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "refarch-gateway.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.args }}
          args:
            {{- toYaml .Values.args | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            - name: JAVA_MAX_MEM_RATIO
              value: {{ .Values.javaHeapMaxMemRatio | quote }}
            {{- if .Values.redis.enabled }}
            - name: SPRING_PROFILES_INCLUDE
              value: redis-session
            {{- if eq .Values.redis.architecture "standalone" }}
            - name: SPRING_DATA_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "refarch-gateway.redisSecretName" . }}
                  key: uri
            {{- end }}
            {{- if and (eq .Values.redis.architecture "replication") .Values.redis.sentinel.enabled }}
            - name: SPRING_DATA_REDIS_SENTINEL_MASTER
              value: {{ .Values.redis.sentinel.masterName }}
            - name: SPRING_DATA_REDIS_SENTINEL_NODES
              value: {{ .Release.Name }}-sentinel.{{ .Release.Namespace }}.svc.cluster.local:26379
            {{- range $prefix := list "SPRING_DATA_REDIS_SENTINEL" "SPRING_DATA_REDIS" }}
            - name: {{ $prefix }}_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "refarch-gateway.redisSecretName" $ }}
                  key: username
            - name: {{ $prefix }}_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "refarch-gateway.redisSecretName" $ }}
                  key: redis-password
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if gt (len .Values.env) 0 }}
            {{- tpl (toYaml .Values.env) . | nindent 12 }}
            {{- end}}
            {{- if gt (len .Values.envAppend) 0 }}
            {{- tpl (toYaml .Values.envAppend) . | nindent 12 }}
            {{- end}}
          {{- if .Values.envFrom }}
          envFrom:
            {{- toYaml .Values.envFrom | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: {{ .Values.applicationYMLMountPath }}
          {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "refarch-gateway.fullname" . }}
            defaultMode: 420
      {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
