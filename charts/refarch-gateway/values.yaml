# Default values for refarch-gateway.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  registry: ghcr.io
  repository: it-at-m/refarch/refarch-gateway
  tag: 1.9.0

  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
args: []

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  # If your ingress controller auto-creates a Route, set these labels only on the first rollout.
  # Otherwise, delete the Route manually before reapplying.
  labels: {}
    # type: web2tier  # or eai
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# Must be changed when resources.limits.memory is changed
javaHeapMaxMemRatio: 30

startupProbe:
  httpGet:
    path: /actuator/health
    port: http
  initialDelaySeconds: 10
  failureThreshold: 9
livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: http
readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

# Additional env on the output Deployment definition.
env:
  - name: TZ
    value: Europe/Berlin

# Additional env on the output Deployment definition.
envAppend: []

# List of ConfigMapRef or SecretRef to inject environment variables
envFrom: []

nodeSelector: {}

tolerations: []

affinity: {}

applicationYMLMountPath: /deployments/config
applicationYML:

serviceMonitor:
  enabled: false
  path: /actuator/metrics
  interval: 30s

redis:
  # When enabled, the chart also adds the Spring profile "redis-session" via SPRING_PROFILES_INCLUDE.
  enabled: true
  # Image configuration, see https://github.com/CloudPirates-io/helm-charts/tree/main/charts/redis#image-configuration
  image:
    tag: 8.10.1-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576 # TODO Overriding here leads to more LCM effort on our side
    pullPolicy: IfNotPresent
  # Common parameters, see https://github.com/CloudPirates-io/helm-charts/tree/main/charts/redis#common-parameters
  architecture: standalone # replication
  replicaCount: 2 # only with replication
  # Authentication, see https://github.com/CloudPirates-io/helm-charts/tree/main/charts/redis#authentication
  # auth:
    # existingSecret: # TODO TEST
  # Metrics, see https://github.com/CloudPirates-io/helm-charts/tree/main/charts/redis#metrics
  metrics:
    enabled: false
    image:
      tag: v1.91.1-alpine@sha256:30e56152988ca4bb3784e10debaac8905b78f6a7ff2bbd362a40b8c2a78eb1d6 # TODO Overriding here leads to more LCM effort on our side
      pullPolicy: IfNotPresent
    resources: # TODO Set good defaults
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 512Mi
    service:
      enabled: true
      name: redis-metrics
    serviceMonitor:
      enabled: true
  # Persistence, see https://github.com/CloudPirates-io/helm-charts/tree/main/charts/redis#persistence
  persistence:
    enabled: true
    size: 1Gi # TODO Set good defaults
  # Resource Management, see https://github.com/CloudPirates-io/helm-charts/tree/main/charts/redis#resource-management
  resources: # TODO Set good defaults
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 512Mi
  # Pod Assignment / Eviction, see https://github.com/CloudPirates-io/helm-charts/tree/main/charts/redis#pod-assignment--eviction
  # terminationGracePeriodSeconds: 60 (for Sentinel)
  # Redis Sentinel Configuration (High Availability), online when architecture "replication", see https://github.com/CloudPirates-io/helm-charts/tree/main/charts/redis#redis-sentinel-configuration-high-availability
  # sentinel:
  # ServiceAccount, might be relevant for Sentinel access to slaves, see https://github.com/CloudPirates-io/helm-charts/tree/main/charts/redis#serviceaccount
