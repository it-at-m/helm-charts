# Minimal values for CI installation in a kind cluster.
# Keycloak and database are simulated/minimal; the gateway is disabled because
# it requires an identity provider to start.
assistantsMigration:
  enabled: false

refarch-templates:
  refarch-gateway:
    enabled: false
  # Exercise the config ConfigMap rendering and mounting. The release name in
  # chart-testing defaults to the chart name, hence the hardcoded ConfigMap
  # names below.
  modules:
    core:
      volumeMounts:
        - name: mucgpt-core-config
          readOnly: true
          mountPath: /app/config.yaml
          subPath: config.yaml
      volumes:
        - name: mucgpt-core-config
          configMap:
            name: mucgpt-core-config
    assistants:
      volumeMounts:
        - name: mucgpt-assistant-config
          readOnly: true
          mountPath: /app/config.yaml
          subPath: config.yaml
      volumes:
        - name: mucgpt-assistant-config
          configMap:
            name: mucgpt-assistant-config

# Exercise the config ConfigMap rendering.
coreConfig:
  data:
    ENV_NAME: "ci"
assistantConfig:
  data:
    LOG_CONFIG:
      LOGLEVEL: INFO

valkey:
  auth:
    enabled: false
