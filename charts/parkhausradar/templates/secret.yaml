{{- $name := printf "%s-frost" .Release.Name }}
{{- /* Created only once with empty values, which are filled in manually in the cluster and kept on upgrades */}}
{{- if not (lookup "v1" "Secret" .Release.Namespace $name) }}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ $name }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
stringData:
  USERNAME: ""
  PASSWORD: ""
{{- end }}
